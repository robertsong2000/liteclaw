[workspace]
resolver = "2"
members = [
    "crates/liteclaw-core",
    "crates/liteclaw-fs",
    "crates/liteclaw-model",
    "crates/liteclaw-skills",
    "crates/liteclaw-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/liteclaw/liteclaw"
authors = ["liteclaw contributors"]

[workspace.dependencies]
# Internal crates
liteclaw-core = { path = "crates/liteclaw-core" }
liteclaw-fs = { path = "crates/liteclaw-fs" }
liteclaw-model = { path = "crates/liteclaw-model" }
liteclaw-skills = { path = "crates/liteclaw-skills" }

# Shared deps — pinned at workspace level for reproducible, lean builds.
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "fs", "process"] }
regex = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tempfile = "3"
serde_yaml = "0.9"

[profile.release]
# Optimize for small binaries — a core liteclaw promise.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
